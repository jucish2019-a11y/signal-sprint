<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Sprint — Team Game</title>
<meta name="description" content="A four-round competitive team game with live host and guest rooms — Rapid Fire trivia, Bluff Call, Prediction Wager, and a Lightning Round.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230B1420'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%23F5A623' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%233ED6B5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1420;
    --panel: #12202F;
    --panel-2: #0F1B29;
    --line: #24384B;
    --amber: #F5A623;
    --teal: #3ED6B5;
    --coral: #E8604C;
    --text: #EAF1F6;
    --muted: #7E93A6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  a{color:var(--teal);}
  .muted{color:var(--muted);}
  .hidden{display:none !important;}

  .title{font-weight:700;font-size:32px;letter-spacing:-0.01em;}
  .title span{color:var(--amber);}
  .subtitle{color:var(--muted);font-size:14px;margin-top:6px;}

  .btn{
    background:transparent;border:1px solid var(--line);color:var(--text);
    padding:12px 20px;border-radius:6px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#141414;}
  .btn.primary:hover{background:#ffbb40;color:#141414;}
  .btn.teal{background:var(--teal);border-color:var(--teal);color:#0B1420;}
  .btn.teal:hover{background:#5be6c9;}
  .btn.small{padding:7px 12px;font-size:12.5px;}
  .btn.danger:hover{border-color:var(--coral);color:var(--coral);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  input[type=text],input[type=number]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:11px 14px;border-radius:6px;font-size:15px;font-family:'Inter',sans-serif;
    width:100%;
  }
  input:focus{outline:none;border-color:var(--amber);}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px;}
  .card-row{display:flex;gap:16px;flex-wrap:wrap;}
  .landing-card{flex:1;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;}
  .landing-card h3{font-size:19px;margin-bottom:8px;}
  .landing-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px;}

  .roundnav{display:flex;gap:2px;margin-bottom:20px;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .roundnav button{flex:1;background:var(--panel);color:var(--muted);border:none;padding:13px 10px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;border-right:1px solid var(--line);text-align:left;}
  .roundnav button:last-child{border-right:none;}
  .roundnav button .num{display:block;font-family:'Space Grotesk',sans-serif;color:var(--muted);font-size:10.5px;margin-bottom:3px;}
  .roundnav button.active{background:var(--panel-2);color:var(--text);}
  .roundnav button.active .num{color:var(--amber);}

  .roomcode{font-family:'Space Grotesk',sans-serif;font-size:15px;letter-spacing:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;display:inline-block;}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px;}

  .timerbox{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:6px;}
  .timer-display{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;min-width:66px;text-align:center;}
  .timer-display.low{color:var(--coral);}
  .icon-btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:5px;width:30px;height:30px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--amber);color:var(--amber);}

  .qtext-lg{font-size:18px;margin:6px 0 4px;}
  .qcat{font-size:11px;color:var(--teal);font-weight:600;}
  .qanswer{font-size:14px;color:var(--amber);margin-top:8px;}

  .players{display:grid;grid-template-columns:repeat(auto-fill, minmax(170px,1fr));gap:10px;margin-top:14px;}
  .player{border:1px solid var(--line);border-radius:6px;padding:12px 14px;position:relative;}
  .player.leader{border-color:var(--amber);}
  .pname{font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .prow{display:flex;align-items:center;justify-content:space-between;}
  .pscore{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;}
  .pbtns{display:flex;gap:5px;}
  .pbtn{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .pbtn:hover{border-color:var(--teal);color:var(--teal);}
  .crown{position:absolute;top:-9px;right:10px;font-size:11px;color:var(--amber);background:var(--bg);padding:0 4px;}

  .sublist{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .subrow{border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .subrow .who{font-weight:600;font-size:13.5px;}
  .subrow .val{color:var(--muted);font-size:13.5px;}
  .subrow.graded{opacity:0.55;}

  .field{margin-bottom:14px;}
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;}

  .waiting{padding:60px 20px;text-align:center;color:var(--muted);}
  .waiting .big{font-size:40px;margin-bottom:10px;}

  .feed{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;}
  .feed div{font-size:12px;color:var(--muted);padding:2px 0;}

  .letterbtns{display:flex;gap:10px;margin-top:16px;}
  .letterbtn{flex:1;padding:20px;font-size:20px;font-weight:700;font-family:'Space Grotesk',sans-serif;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;cursor:pointer;}
  .letterbtn:hover{border-color:var(--teal);color:var(--teal);}
  .letterbtn.picked{border-color:var(--amber);color:var(--amber);}

  .bigboard{display:flex;flex-direction:column;gap:12px;max-width:680px;margin:10px auto 0;}
  .bigrow{display:flex;align-items:center;gap:20px;border:1px solid var(--line);border-radius:10px;padding:18px 24px;background:var(--panel-2);}
  .bigrow.first{border-color:var(--amber);background:rgba(245,166,35,0.08);}
  .bigrank{font-size:26px;width:46px;text-align:center;font-family:'Space Grotesk',sans-serif;flex-shrink:0;}
  .bigname{flex:1;font-size:20px;font-weight:600;}
  .bigscore{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;color:var(--amber);}

  .errbox{background:rgba(232,96,76,0.12);border:1px solid var(--coral);color:var(--coral);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--amber);padding:10px 18px;border-radius:6px;font-size:13.5px;z-index:50;}

  @media (max-width:680px){
    .roundnav{flex-direction:column;}
    .roundnav button{border-right:none;border-bottom:1px solid var(--line);}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  // ---------- Question banks (shared by host + guest) ----------
  const round1Questions = [
    {cat:'General', q:'What is the only planet in our solar system rotating on its side?', a:'Uranus'},
    {cat:'Wordplay', q:'What seven-letter word becomes longer when the third letter is removed?', a:'Lounger'},
    {cat:'Geography', q:'Which country has the most time zones?', a:'France (12, including territories)'},
    {cat:'Science', q:'What is the hardest natural substance on Earth?', a:'Diamond'},
    {cat:'History', q:'Which empire built Machu Picchu?', a:'The Inca Empire'},
    {cat:'Food', q:'What spice comes from the Crocus flower?', a:'Saffron'},
    {cat:'Science', q:'How many hearts does an octopus have?', a:'Three'},
    {cat:'General', q:'What is the smallest country in the world by area?', a:'Vatican City'},
    {cat:'Geography', q:'Which desert is the largest in the world?', a:'The Sahara'},
    {cat:'History', q:'In which century did the Titanic sink?', a:'The 20th century (1912)'},
    {cat:'Science', q:'What gas do plants absorb from the atmosphere?', a:'Carbon dioxide'},
    {cat:'Sports', q:'How many players are on a standard soccer team on the field?', a:'Eleven'},
    {cat:'Food', q:'What is the main ingredient in guacamole?', a:'Avocado'},
    {cat:'Geography', q:'Which two countries share the longest international border?', a:'USA and Canada'},
    {cat:'General', q:'How many bones does a shark skeleton have?', a:'Zero — it\u2019s made of cartilage'},
    {cat:'Wordplay', q:'What is the only number spelled with letters in alphabetical order?', a:'Forty'},
    {cat:'Science', q:'What is the most abundant gas in Earth\u2019s atmosphere?', a:'Nitrogen'},
    {cat:'History', q:'Who painted the ceiling of the Sistine Chapel?', a:'Michelangelo'},
    {cat:'Geography', q:'What is the longest river in the world?', a:'The Nile'},
    {cat:'General', q:'How many time zones does mainland China officially observe?', a:'One'},
    {cat:'Sports', q:'In tennis, what is a score of zero called?', a:'Love'},
    {cat:'Food', q:'What fruit are prunes made from?', a:'Plums'},
    {cat:'Science', q:'What is the chemical symbol for iron?', a:'Fe'},
    {cat:'General', q:'How many strings does a standard violin have?', a:'Four'},
    {cat:'Geography', q:'Which country has the most natural lakes?', a:'Canada'},
    {cat:'History', q:'Which ancient wonder stood in Alexandria, Egypt?', a:'The Lighthouse of Alexandria'},
    {cat:'Wordplay', q:'What five-letter word becomes shorter when you add two letters to it?', a:'Short (add "er" to get "shorter")'},
    {cat:'Science', q:'What organ in the human body produces insulin?', a:'The pancreas'},
    {cat:'General', q:'What is the tallest species of penguin?', a:'Emperor penguin'},
    {cat:'Sports', q:'How many rings are on the Olympic flag?', a:'Five'}
  ];
  const round3Questions = [
    {cat:'Estimate', q:'How many keys does a standard piano have?', a:'88'},
    {cat:'Estimate', q:'How many bones are in the human body?', a:'206'},
    {cat:'Estimate', q:'What percentage of the Earth is covered by water? (whole number)', a:'71'},
    {cat:'Estimate', q:'How many time zones does Russia span?', a:'11'},
    {cat:'Estimate', q:'How many countries are there in Africa?', a:'54'},
    {cat:'Estimate', q:'What is the average human body temperature in Celsius (whole number)?', a:'37'},
    {cat:'Estimate', q:'How many muscles are in the human hand and forearm combined?', a:'34'},
    {cat:'Estimate', q:'How many floors does the Empire State Building have?', a:'102'},
    {cat:'Estimate', q:'How many teeth does an adult human have?', a:'32'},
    {cat:'Estimate', q:'How many hexagons are on a standard soccer ball?', a:'12 (plus 20 pentagons)'},
    {cat:'Estimate', q:'How many years did the Hundred Years\u2019 War actually last?', a:'116'},
    {cat:'Estimate', q:'How many chromosomes does a human cell have?', a:'46'}
  ];
  const round4Questions = [
    {cat:'Flash', q:'Capital of Japan?', a:'Tokyo'},
    {cat:'Flash', q:'How many continents are there?', a:'Seven'},
    {cat:'Flash', q:'Chemical symbol for gold?', a:'Au'},
    {cat:'Flash', q:'How many strings on a standard guitar?', a:'Six'},
    {cat:'Flash', q:'Largest ocean on Earth?', a:'Pacific'},
    {cat:'Flash', q:'How many sides does a hexagon have?', a:'Six'},
    {cat:'Flash', q:'Fastest land animal?', a:'Cheetah'},
    {cat:'Flash', q:'Currency used in Japan?', a:'Yen'},
    {cat:'Flash', q:'How many colors in a rainbow?', a:'Seven'},
    {cat:'Flash', q:'Freezing point of water in Celsius?', a:'0 degrees'},
    {cat:'Flash', q:'Capital of Australia?', a:'Canberra'},
    {cat:'Flash', q:'How many legs does a spider have?', a:'Eight'},
    {cat:'Flash', q:'Chemical symbol for water?', a:'H2O'},
    {cat:'Flash', q:'Largest planet in our solar system?', a:'Jupiter'},
    {cat:'Flash', q:'How many minutes in a full day?', a:'1,440'},
    {cat:'Flash', q:'Capital of Canada?', a:'Ottawa'},
    {cat:'Flash', q:'How many wheels on a standard tricycle?', a:'Three'},
    {cat:'Flash', q:'Smallest prime number?', a:'Two'},
    {cat:'Flash', q:'National language of Brazil?', a:'Portuguese'},
    {cat:'Flash', q:'How many squares on a chessboard?', a:'64'},
    {cat:'Flash', q:'Capital of Egypt?', a:'Cairo'},
    {cat:'Flash', q:'How many bones in a human ribcage (pairs)?', a:'12 pairs'},
    {cat:'Flash', q:'Currency used in the UK?', a:'Pound sterling'},
    {cat:'Flash', q:'How many letters in the English alphabet?', a:'26'},
    {cat:'Flash', q:'Largest mammal on Earth?', a:'Blue whale'}
  ];
  const NUM_WORDS = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};

  function normalizeText(s){
    return String(s==null?'':s)
      .toLowerCase()
      .replace(/\(.*?\)/g,' ')
      .replace(/[^a-z0-9\s]/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }
  function stripArticles(s){ return s.replace(/\b(the|a|an)\b/g,' ').replace(/\s+/g,' ').trim(); }
  function wordsToDigits(s){ return s.replace(/\b[a-z]+\b/g, w => (w in NUM_WORDS) ? String(NUM_WORDS[w]) : w); }
  function extractNum(s){ const m = s.match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }

  function answersMatch(userText, correctText){
    const a = stripArticles(normalizeText(userText));
    const b = stripArticles(normalizeText(correctText));
    if(!a || !b) return false;
    if(a === b) return true;
    if(a.length>=3 && b.includes(a)) return true;
    if(b.length>=3 && a.includes(b)) return true;
    const numA = extractNum(wordsToDigits(a));
    const numB = extractNum(wordsToDigits(b));
    if(numA!=null && numB!=null && numA===numB) return true;
    return false;
  }

  const ROUND_NAMES = {1:'Rapid Fire', 2:'Bluff Call', 3:'Prediction Wager', 4:'Lightning Round'};

  // ---------- State ----------
  const API = '/api/room';
  let state = {
    view: 'landing',       // landing | host | guest
    code: null,
    hostToken: null,
    playerId: null,
    nickname: null,
    room: null,
    activeRound: 0,        // which round tab is shown (host can browse ahead of room.round)
    hostShowingLeaderboard: false,
    err: null,
  };
  let draft = {};           // uncommitted input values, keyed by field name, survives re-render
  let lastStructKey = null;
  let pollTimer = null;

  const app = document.getElementById('app');

  function save(){
    if(state.view === 'host'){
      localStorage.setItem('ss-session', JSON.stringify({view:'host', code:state.code, hostToken:state.hostToken}));
    } else if(state.view === 'guest'){
      localStorage.setItem('ss-session', JSON.stringify({view:'guest', code:state.code, playerId:state.playerId, nickname:state.nickname}));
    } else {
      localStorage.removeItem('ss-session');
    }
  }

  async function api(body){
    const res = await fetch(API, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || 'Request failed'); }
    return data;
  }

  function toast(msg){
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }

  // ---------- Polling ----------
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(async ()=>{
      if(!state.code) return;
      try{
        const data = await api({action:'state', code: state.code});
        state.room = data.room;
        state.err = null;
        render();
      }catch(e){
        state.err = e.message;
        if(e.message === 'Room not found'){
          stopPolling();
          localStorage.removeItem('ss-session');
          state = {view:'landing', code:null, hostToken:null, playerId:null, nickname:null, room:null, activeRound:0, err:'That room no longer exists.'};
          render();
        }
      }
    }, 1500);
  }
  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

  // ---------- Local timer ticking (interpolated between polls) ----------
  setInterval(()=>{
    const t = document.getElementById('timerDisplay');
    if(!t || !state.room) return;
    const timer = state.room.timer;
    let remaining = timer.remaining;
    if(timer.running && timer.endsAt){
      remaining = Math.max(0, Math.round((timer.endsAt - Date.now())/1000));
    }
    t.textContent = fmtTime(remaining);
    t.classList.toggle('low', remaining<=10);
  }, 500);

  function fmtTime(s){
    s = Math.max(0,s);
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return m+':'+sec;
  }

  // ---------- Boot: restore session ----------
  async function boot(){
    const params = new URLSearchParams(location.search);
    const prefillCode = params.get('code');
    const saved = localStorage.getItem('ss-session');
    if(saved){
      try{
        const s = JSON.parse(saved);
        const data = await api({action:'state', code:s.code});
        state.room = data.room;
        state.code = s.code;
        if(s.view==='host' && data.room){
          state.view='host'; state.hostToken=s.hostToken; state.activeRound = data.room.round || 0;
        } else if(s.view==='guest' && data.room && data.room.players[s.playerId]){
          state.view='guest'; state.playerId=s.playerId; state.nickname=s.nickname;
        } else {
          localStorage.removeItem('ss-session');
          state.view='landing'; state.code=null;
        }
      }catch(e){
        localStorage.removeItem('ss-session');
      }
    }
    if(state.view==='landing' && prefillCode){
      draft.joinCode = prefillCode.toUpperCase();
      state.view = 'join-form';
    }
    render();
    if(state.code) startPolling();
  }

  // ================= RENDER =================
  function render(){
    const room = state.room;
    const structKey = JSON.stringify([
      state.view, state.err,
      room ? room.round : null,
      room ? room.active.kind : null,
      room ? room.active.questionIndex : null,
      room ? room.active.presenterId : null,
      room ? Object.keys(room.players).length : 0,
      state.activeRound,
      state.hostShowingLeaderboard,
    ]);
    if(structKey !== lastStructKey){
      lastStructKey = structKey;
      fullRender();
    } else {
      updateLive();
    }
  }

  function fullRender(){
    if(state.view==='landing') return renderLanding();
    if(state.view==='join-form') return renderJoinForm();
    if(state.view==='host') return state.hostShowingLeaderboard ? renderHostLeaderboard() : renderHost();
    if(state.view==='guest') return renderGuest();
  }

  // ---------- Landing ----------
  function renderLanding(){
    app.innerHTML = `
      <div class="title">Signal <span>Sprint</span></div>
      <div class="subtitle">A four-round competitive team game — host from one screen, everyone else joins from their own.</div>
      ${state.err ? `<div class="errbox" style="margin-top:18px;">${esc(state.err)}</div>` : ''}
      <div class="card-row" style="margin-top:26px;">
        <div class="landing-card">
          <h3>Host a game</h3>
          <p>Create a room, get a code to share, and run the rounds from your screen.</p>
          <button class="btn primary" id="btnHost">Create room</button>
        </div>
        <div class="landing-card">
          <h3>Join a game</h3>
          <p>Got a room code from your host? Enter it and pick a nickname.</p>
          <button class="btn teal" id="btnJoin">Enter code</button>
        </div>
      </div>
    `;
    document.getElementById('btnHost').onclick = async ()=>{
      try{
        const data = await api({action:'create-room'});
        state.code = data.code; state.hostToken = data.hostToken; state.room = data.room;
        state.view='host'; state.activeRound=0;
        save(); startPolling(); render();
      }catch(e){ state.err = e.message; render(); }
    };
    document.getElementById('btnJoin').onclick = ()=>{ state.view='join-form'; render(); };
  }

  function renderJoinForm(){
    app.innerHTML = `
      <div class="title">Signal <span>Sprint</span></div>
      <div class="subtitle">Join a room</div>
      <div class="panel" style="max-width:420px;margin-top:22px;">
        ${state.err ? `<div class="errbox">${esc(state.err)}</div>` : ''}
        <div class="field">
          <label>Room code</label>
          <input type="text" id="fCode" maxlength="8" style="text-transform:uppercase;letter-spacing:2px;" value="${esc(draft.joinCode||'')}">
        </div>
        <div class="field">
          <label>Your nickname</label>
          <input type="text" id="fName" maxlength="24" value="${esc(draft.joinName||'')}">
        </div>
        <div class="muted" style="font-size:12px;margin-bottom:16px;">Got disconnected or need to swap devices? Rejoin with the exact same nickname and your score comes back with you.</div>
        <div style="display:flex;gap:10px;">
          <button class="btn" id="btnBack">Back</button>
          <button class="btn primary" id="btnDoJoin" style="flex:1;">Join room</button>
        </div>
      </div>
    `;
    const fCode = document.getElementById('fCode');
    const fName = document.getElementById('fName');
    fCode.oninput = ()=>{ draft.joinCode = fCode.value.toUpperCase(); };
    fName.oninput = ()=>{ draft.joinName = fName.value; };
    document.getElementById('btnBack').onclick = ()=>{ state.view='landing'; state.err=null; render(); };
    document.getElementById('btnDoJoin').onclick = async ()=>{
      const code = (fCode.value||'').toUpperCase().trim();
      const nickname = (fName.value||'').trim();
      if(!code || !nickname){ state.err='Enter both a room code and a nickname.'; render(); return; }
      try{
        const data = await api({action:'join', code, nickname});
        state.code = code; state.playerId = data.playerId; state.nickname = nickname; state.room = data.room;
        state.view='guest'; state.err=null;
        draft = {};
        save(); startPolling(); render();
        if(data.rejoined) toast('Welcome back — your score carried over.');
      }catch(e){ state.err = e.message; render(); }
    };
  }

  // ---------- Shared bits ----------
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function scoreboardHtml(room){
    const players = Object.entries(room.players).map(([id,p])=>({id,...p}));
    const max = players.length ? Math.max(...players.map(p=>p.score)) : 0;
    if(!players.length) return `<div class="muted" style="font-size:13px;">No one has joined yet.</div>`;
    return `<div class="players">` + players.sort((a,b)=>b.score-a.score).map(p=>`
      <div class="player ${p.score===max && max>0 ? 'leader':''}" data-pid="${p.id}">
        ${p.score===max && max>0 ? '<div class="crown">Leading</div>' : ''}
        <div class="pname">${esc(p.nickname)}</div>
        <div class="prow">
          <div class="pscore">${p.score}</div>
          <div class="pbtns" data-host-only="1">
            <button class="pbtn" data-act="minus" data-pid="${p.id}">−</button>
            <button class="pbtn" data-act="plus" data-pid="${p.id}">+</button>
          </div>
        </div>
      </div>
    `).join('') + `</div>`;
  }

  function bigScoreboardHtml(room){
    const players = Object.entries(room.players).map(([id,p])=>({id,...p})).sort((a,b)=>b.score-a.score);
    if(!players.length) return `<div class="muted" style="text-align:center;padding:40px;">No one has joined yet.</div>`;
    const medals = ['🥇','🥈','🥉'];
    return `<div class="bigboard">` + players.map((p,i)=>`
      <div class="bigrow ${i===0?'first':''}">
        <div class="bigrank">${medals[i]||(i+1)}</div>
        <div class="bigname">${esc(p.nickname)}</div>
        <div class="bigscore">${p.score}</div>
      </div>
    `).join('') + `</div>`;
  }

  function timerHtml(room){
    let remaining = room.timer.remaining;
    if(room.timer.running && room.timer.endsAt) remaining = Math.max(0, Math.round((room.timer.endsAt - Date.now())/1000));
    return `
      <div class="timerbox">
        <div id="timerDisplay" class="timer-display ${remaining<=10?'low':''}">${fmtTime(remaining)}</div>
      </div>
    `;
  }

  // ---------- Update just the live regions (scoreboard/timer/feed) without rebuilding inputs ----------
  function updateLive(){
    const room = state.room;
    if(!room) return;
    const sb = document.getElementById('liveScoreboard');
    if(sb) sb.innerHTML = (state.view==='host' && state.hostShowingLeaderboard) ? bigScoreboardHtml(room) : scoreboardHtml(room);
    const feed = document.getElementById('liveFeed');
    if(feed) feed.innerHTML = (room.log||[]).map(l=>`<div>${esc(l.msg)}</div>`).join('');
    const subs = document.getElementById('liveSubs');
    if(subs) subs.innerHTML = submissionsHtml(room);
    wireScoreButtons();
  }

  function wireScoreButtons(){
    if(state.view!=='host') return;
    document.querySelectorAll('.pbtn').forEach(btn=>{
      btn.onclick = async ()=>{
        const delta = btn.dataset.act==='plus' ? 1 : -1;
        await hostAction('adjust-score', {playerId: btn.dataset.pid, delta});
      };
    });
  }

  function submissionsHtml(room){
    const entries = Object.entries(room.submissions||{}).sort((a,b)=>a[1].submittedAt-b[1].submittedAt);
    if(!entries.length) return `<div class="muted" style="font-size:13px;">No submissions yet.</div>`;
    const isFreeText = room.round===1 || room.round===4;
    const winPts = room.round===1 ? 2 : 1;
    const wrongPts = room.round===1 ? 1 : 0;
    return `<div class="sublist">` + entries.map(([pid,s])=>{
      const player = room.players[pid];
      if(!player) return '';
      let valDisplay = '';
      if(room.round===2) valDisplay = 'Voted: ' + esc(s.value);
      else if(room.round===3) valDisplay = `Guess ${esc(s.value && s.value.guess)} · wagered ${esc(s.value && s.value.wager)}`;
      else valDisplay = esc(s.value);
      const graded = s.graded ? 'graded' : '';
      const gradeBtns = (state.view==='host' && isFreeText && !s.graded) ? `
        <span>
          <button class="btn small teal" data-grade-correct="${pid}" data-pts="${winPts}">Correct +${winPts}</button>
          <button class="btn small danger" data-grade-wrong="${pid}" data-pts="${wrongPts}">Wrong${wrongPts?' −'+wrongPts:''}</button>
        </span>` : (s.graded ? `<span class="muted" style="font-size:12px;">${s.correct?'marked correct':'marked wrong'}</span>` : '');
      return `<div class="subrow ${graded}">
        <div><span class="who">${esc(player.nickname)}</span> <span class="val">— ${valDisplay}</span></div>
        ${gradeBtns}
      </div>`;
    }).join('') + `</div>`;
  }

  async function autoGradeRound(correctAnswer, pointsWin){
    const room = state.room;
    const entries = Object.entries(room.submissions||{}).filter(([,s])=>!s.graded).sort((a,b)=>a[1].submittedAt-b[1].submittedAt);
    let winnerFound = false;
    for(const [pid, s] of entries){
      if(!winnerFound && answersMatch(s.value, correctAnswer)){
        await hostAction('grade-submission', {playerId:pid, correct:true, points:pointsWin});
        winnerFound = true;
      } else {
        await hostAction('grade-submission', {playerId:pid, correct:false, points:0});
      }
    }
    toast(winnerFound ? 'Points auto-assigned.' : 'No matching answer found — grade manually below.');
  }

  async function hostAction(sub, payload){
    try{
      const data = await api({action:'host-action', code:state.code, hostToken:state.hostToken, sub, payload: payload||{}});
      state.room = data.room;
      render();
    }catch(e){ toast(e.message); }
  }

  function renderHostLeaderboard(){
    const room = state.room;
    app.innerHTML = `
      <div class="toprow">
        <div>
          <div class="title">Signal <span>Sprint</span></div>
          <div class="subtitle">Leaderboard · Room <span class="roomcode">${room.code}</span></div>
        </div>
        <button class="btn primary" id="btnBackToControls">Back to controls</button>
      </div>
      <div class="panel">
        <div id="liveScoreboard">${bigScoreboardHtml(room)}</div>
      </div>
    `;
    document.getElementById('btnBackToControls').onclick = ()=>{
      state.hostShowingLeaderboard = false;
      lastStructKey = null;
      render();
    };
  }

  // ---------- Host view ----------
  function renderHost(){
    const room = state.room;
    if(!room){ app.innerHTML = '<div class="muted">Loading…</div>'; return; }
    const shareUrl = location.origin + location.pathname + '?code=' + room.code;
    const activeRound = state.activeRound;
    const playerCount = Object.keys(room.players).length;

    app.innerHTML = `
      <div class="toprow">
        <div>
          <div class="title">Signal <span>Sprint</span></div>
          <div class="subtitle">Hosting · <span class="roomcode">${room.code}</span></div>
        </div>
        <div id="timerWrap"></div>
      </div>

      <div class="panel" style="margin-bottom:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
          <div>
            <div class="muted" style="font-size:12.5px;margin-bottom:4px;">Share this with your team</div>
            <div style="font-size:14px;">${esc(shareUrl)}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn small" id="btnCopyLink">Copy link</button>
            <button class="btn small teal" id="btnShowLeaderboard">Present leaderboard</button>
          </div>
        </div>
      </div>

      <div id="hostMain"></div>

      <details style="margin-top:20px;">
        <summary class="muted" style="cursor:pointer;font-size:12.5px;">Room settings</summary>
        <div class="panel" style="margin-top:10px;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn small" id="btnResetScores">Reset scores</button>
            <button class="btn small danger" id="btnEndRoom">End room</button>
          </div>
        </div>
      </details>
    `;

    document.getElementById('timerWrap').innerHTML = timerHtml(room) + `
      <div class="timerbtns" style="display:flex;gap:6px;margin-top:6px;">
        <button class="icon-btn" id="tStart" title="Start/Pause">${room.timer.running?'❚❚':'▶'}</button>
        <button class="icon-btn" id="tReset" title="Reset">↺</button>
        <button class="icon-btn" id="tLess">–</button>
        <button class="icon-btn" id="tMore">+</button>
      </div>
    `;
    document.getElementById('tStart').onclick = ()=> hostAction(room.timer.running ? 'timer-pause' : 'timer-start');
    document.getElementById('tReset').onclick = ()=> hostAction('timer-reset');
    document.getElementById('tLess').onclick = ()=> hostAction('timer-adjust', {delta:-15});
    document.getElementById('tMore').onclick = ()=> hostAction('timer-adjust', {delta:15});

    document.getElementById('btnCopyLink').onclick = ()=>{
      navigator.clipboard.writeText(shareUrl).then(()=>toast('Link copied'));
    };
    document.getElementById('btnShowLeaderboard').onclick = ()=>{
      state.hostShowingLeaderboard = true;
      lastStructKey = null;
      render();
    };
    document.getElementById('btnResetScores').onclick = ()=> hostAction('reset-scores');
    document.getElementById('btnEndRoom').onclick = ()=>{
      if(confirm('End this room? Everyone will be disconnected.')){
        stopPolling(); localStorage.removeItem('ss-session');
        state = {view:'landing', code:null, hostToken:null, playerId:null, nickname:null, room:null, activeRound:0, hostShowingLeaderboard:false, err:null};
        render();
      }
    };

    const mainEl = document.getElementById('hostMain');
    if(room.round === 0){
      renderLobby(mainEl, room, playerCount);
    } else {
      renderRoundArea(mainEl, room, activeRound);
    }
  }

  function renderLobby(el, room, playerCount){
    el.innerHTML = `
      <div class="panel">
        <h2 style="margin-bottom:8px;">Waiting room</h2>
        <div class="muted" style="font-size:13.5px;margin-bottom:18px;">Share the code above. Once your team's joined, start whenever you're ready — you can also jump to any round later from here.</div>
        <div class="muted" style="font-size:12.5px;margin-bottom:8px;">${playerCount} player${playerCount===1?'':'s'} joined</div>
        <div id="liveScoreboard">${scoreboardHtml(room)}</div>
        <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;">
          ${[1,2,3,4].map(r=>`<button class="btn ${r===1?'primary':''}" data-startround="${r}">Start Round ${r}: ${ROUND_NAMES[r]}</button>`).join('')}
        </div>
      </div>
    `;
    el.querySelectorAll('[data-startround]').forEach(btn=>{
      btn.onclick = ()=>{
        const r = parseInt(btn.dataset.startround,10);
        state.activeRound = r;
        hostAction('set-round', {round:r});
      };
    });
  }

  function renderRoundArea(el, room, activeRound){
    el.innerHTML = `
      <div class="roundnav" id="roundNav">
        ${[1,2,3,4].map(r=>`<button data-r="${r}" class="${activeRound===r?'active':''}"><span class="num">Round ${r}</span>${ROUND_NAMES[r]}</button>`).join('')}
      </div>
      <div class="panel" id="roundPanel"></div>
      <div class="panel" style="margin-top:20px;">
        <h3 style="font-size:16px;margin-bottom:10px;">Scoreboard</h3>
        <div id="liveScoreboard">${scoreboardHtml(room)}</div>
        <div class="feed" id="liveFeed">${(room.log||[]).map(l=>`<div>${esc(l.msg)}</div>`).join('')}</div>
      </div>
    `;
    document.querySelectorAll('#roundNav button').forEach(btn=>{
      btn.onclick = ()=>{
        const r = parseInt(btn.dataset.r,10);
        state.activeRound = r;
        if(room.round !== r) hostAction('set-round', {round:r});
        else render();
      };
    });
    renderHostRoundPanel(room, activeRound);
    wireScoreButtons();
  }

  function nextUnusedIndex(bank, used){
    for(let i=0;i<bank.length;i++){ if(!used.includes(i)) return i; }
    return null;
  }

  function renderHostRoundPanel(room, r){
    const panel = document.getElementById('roundPanel');
    if(r===1 || r===4){
      const bank = r===1 ? round1Questions : round4Questions;
      const used = (room.usedQuestions && room.usedQuestions[String(r)]) || [];
      const idx = room.active.questionIndex;
      const current = idx!=null ? bank[idx] : null;
      const upNext = nextUnusedIndex(bank, used);
      const allUsed = upNext===null;
      panel.innerHTML = `
        <h2>${ROUND_NAMES[r]}</h2>
        <div class="muted" style="font-size:13.5px;margin-bottom:6px;">${r===1 ? 'Open a question, let guests submit answers, then grade each submission.' : 'One continuous timer — open questions back to back, grade quickly.'}</div>
        <div class="muted" style="font-size:12px;margin-bottom:16px;">${used.length} of ${bank.length} questions used${allUsed?' — you\'ve used them all':''}</div>
        <div style="margin-bottom:14px;">
          <button class="btn primary" id="btnOpenNext" ${allUsed?'disabled':''}>Open next question</button>
        </div>
        <details style="margin-bottom:16px;">
          <summary class="muted" style="cursor:pointer;font-size:12.5px;">More options</summary>
          <div class="row2" style="margin-top:10px;">
            <div>
              <select id="qSelect" style="width:100%;padding:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;">
                ${bank.map((q,i)=>`<option value="${i}" ${idx===i?'selected':''}>${i+1}. ${used.includes(i)?'✓ ':''}${esc(q.q.slice(0,40))}${q.q.length>40?'…':''}</option>`).join('')}
              </select>
            </div>
            <div style="display:flex;align-items:flex-end;">
              <button class="btn small" id="btnOpenQ">Open selected</button>
            </div>
          </div>
          <div style="margin-top:10px;">
            <button class="btn small" id="btnResetUsed">Reset used list</button>
          </div>
        </details>
        ${current ? `
          <div class="qcat">${esc(current.cat)}</div>
          <div class="qtext-lg">${esc(current.q)}</div>

            <button class="btn small" id="btnCloseSub">Close submissions</button>

          </div>
          ${room.active.kind==='revealed' ? `<div class="qanswer">Answer: ${esc(current.a)}</div>` : ''}
        ` : `<div class="muted" style="font-size:13.5px;">Click "Open next question" when you're ready.</div>`}
        <h3 style="font-size:14.5px;margin:22px 0 4px;">Submissions</h3>
        <div id="liveSubs">${submissionsHtml(room)}</div>
      `;
      const openNext = document.getElementById('btnOpenNext');
      if(openNext) openNext.onclick = ()=>{ if(upNext!=null) hostAction('open-question', {questionIndex: upNext}); };
      document.getElementById('btnOpenQ').onclick = ()=> hostAction('open-question', {questionIndex: parseInt(document.getElementById('qSelect').value,10)});
      document.getElementById('btnResetUsed').onclick = ()=>{ if(confirm('Reset the used-question list for this round?')) hostAction('reset-used', {round:r}); };
      const cs = document.getElementById('btnCloseSub'); if(cs) cs.onclick = ()=> hostAction('close-submissions');
      const rv = document.getElementById('btnRevealAns');
      if(rv) rv.onclick = async ()=>{
        await hostAction('mark-revealed');
        await autoGradeRound(current.a, r===1?2:1);
      };
      wireGradeButtons();
    }

    else if(r===2){
      const players = Object.entries(room.players);
      const usedP = room.usedPresenters || [];
      const remaining = players.filter(([id])=>!usedP.includes(id));
      const allPresented = players.length>0 && remaining.length===0;
      panel.innerHTML = `
        <h2>Bluff Call</h2>
        <div class="muted" style="font-size:13.5px;margin-bottom:6px;">Pick who's presenting. They say three statements out loud — two true, one lie. Everyone else votes A, B, or C on their own device.</div>
        <div class="muted" style="font-size:12px;margin-bottom:16px;">${usedP.length} of ${players.length} players have presented${allPresented?' — everyone\'s had a turn':''}</div>
        <div style="margin-bottom:14px;">
          <button class="btn primary" id="btnNextPresenter" ${remaining.length===0?'disabled':''}>Pick next presenter & open voting</button>
        </div>
        <details style="margin-bottom:16px;">
          <summary class="muted" style="cursor:pointer;font-size:12.5px;">More options</summary>

            <button class="btn small" id="btnResetPresenters">Reset presenter list</button>
          </div>
        </details>
        <div style="margin-bottom:16px;">Status: <b>${room.active.kind}</b>${room.active.presenterId && room.players[room.active.presenterId] ? ' · Presenter: '+esc(room.players[room.active.presenterId].nickname) : ''}</div>
        <div class="row2" style="margin-bottom:16px;">
          <div>
            <label>Which one was the lie?</label>
            <select id="lieSelect" style="width:100%;padding:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;">

        hostAction('open-question', {questionIndex: null});

      if(nextP) nextP.onclick = async ()=>{
        if(!remaining.length) return;

        await hostAction('open-question', {questionIndex: null});

      const idx = room.active.questionIndex;
      const current = idx!=null ? round3Questions[idx] : null;
      const parsedAnswer = current ? (current.a.match(/\d+/) ? current.a.match(/\d+/)[0] : '') : '';
      const upNext3 = nextUnusedIndex(round3Questions, used);
      const allUsed3 = upNext3===null;

        <h2>Prediction Wager</h2>
        <div class="muted" style="font-size:13.5px;margin-bottom:6px;">Open a question — guests submit a numeric guess plus a 1–3 point wager. Closest guess wins their wager, everyone else loses theirs.</div>

          <button class="btn primary" id="btnOpenNext3" ${allUsed3?'disabled':''}>Open next question</button>

          <summary class="muted" style="cursor:pointer;font-size:12.5px;">More options</summary>

              <select id="qSelect3" style="width:100%;padding:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;">
                ${round3Questions.map((q,i)=>`<option value="${i}" ${idx===i?'selected':''}>${i+1}. ${used.includes(i)?'✓ ':''}${esc(q.q.slice(0,40))}${q.q.length>40?'…':''}</option>`).join('')}
              </select>
            </div>
            <div style="display:flex;align-items:flex-end;">
              <button class="btn small" id="btnOpenQ3">Open selected</button>
            </div>
          </div>
          <div style="margin-top:10px;">
            <button class="btn small" id="btnResetUsed3">Reset used list</button>
          </div>
        </details>
        ${current ? `
          <div class="qcat">${esc(current.cat)}</div>
          <div class="qtext-lg">${esc(current.q)}</div>
          <div style="margin:10px 0;">Status: <b>${room.active.kind}</b></div>
          <div class="row2" style="margin-bottom:16px;">
            <div>
              <label>Actual value</label>
              <input type="number" id="actualVal" value="${esc(parsedAnswer)}">
            </div>
            <div style="display:flex;align-items:flex-end;gap:8px;">
              <button class="btn small" id="btnCloseSub3">Close submissions</button>
              <button class="btn small teal" id="btnRevealWager">Reveal & score</button>

          </div>
          ${room.active.kind==='revealed' ? `<div class="qanswer">Actual value: ${esc(room.active.actualValue)}</div>` : ''}
        ` : `<div class="muted" style="font-size:13.5px;">Click "Open next question" when you're ready.</div>`}
        <h3 style="font-size:14.5px;margin:22px 0 4px;">Guesses</h3>
        <div id="liveSubs">${submissionsHtml(room)}</div>

      const openNext3 = document.getElementById('btnOpenNext3');
      if(openNext3) openNext3.onclick = ()=>{ if(upNext3!=null) hostAction('open-question', {questionIndex: upNext3}); };
      document.getElementById('btnOpenQ3').onclick = ()=> hostAction('open-question', {questionIndex: parseInt(document.getElementById('qSelect3').value,10)});
      document.getElementById('btnResetUsed3').onclick = ()=>{ if(confirm('Reset the used-question list for this round?')) hostAction('reset-used', {round:3}); };
      const cs3 = document.getElementById('btnCloseSub3'); if(cs3) cs3.onclick = ()=> hostAction('close-submissions');
      const rv3 = document.getElementById('btnRevealWager'); if(rv3) rv3.onclick = ()=> hostAction('reveal-wager', {actualValue: parseFloat(document.getElementById('actualVal').value)});
    }
  }

  function wireGradeButtons(){
    document.querySelectorAll('[data-grade-correct]').forEach(btn=>{
      btn.onclick = ()=> hostAction('grade-submission', {playerId: btn.dataset.gradeCorrect, correct:true, points: parseInt(btn.dataset.pts,10)});
    });
    document.querySelectorAll('[data-grade-wrong]').forEach(btn=>{
      btn.onclick = ()=> hostAction('grade-submission', {playerId: btn.dataset.gradeWrong, correct:false, points: parseInt(btn.dataset.pts,10)});
    });
  }

  // ---------- Guest view ----------
  function renderGuest(){
    const room = state.room;
    if(!room){ app.innerHTML = '<div class="muted">Loading…</div>'; return; }
    const me = room.players[state.playerId];
    if(!me){
      app.innerHTML = `<div class="errbox">You've been removed from this room.</div>`;
      return;
    }
    app.innerHTML = `
      <div class="toprow">
        <div>
          <div class="title">Signal <span>Sprint</span></div>
          <div class="subtitle">Playing as <b>${esc(me.nickname)}</b> · Room <span class="roomcode">${room.code}</span></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <div id="timerWrap">${timerHtml(room)}</div>
          <button class="btn small" id="btnLeaveRoom">Leave room</button>
        </div>
      </div>
      <div class="panel" id="guestRoundPanel"></div>
      <div class="panel" style="margin-top:20px;">
        <h3 style="font-size:16px;margin-bottom:10px;">Scoreboard</h3>
        <div id="liveScoreboard">${scoreboardHtml(room)}</div>
      </div>
    `;
    document.getElementById('btnLeaveRoom').onclick = ()=>{
      stopPolling(); localStorage.removeItem('ss-session');
      state = {view:'landing', code:null, hostToken:null, playerId:null, nickname:null, room:null, activeRound:0, hostShowingLeaderboard:false, err:null};
      lastStructKey = null;
      render();
    };
    renderGuestRoundPanel(room, me);
  }

  function renderGuestRoundPanel(room, me){
    const panel = document.getElementById('guestRoundPanel');
    const mySub = room.submissions[state.playerId];

    if(room.round===0){
      panel.innerHTML = `<div class="waiting"><div class="big">⏳</div>Waiting for the host to start round 1…</div>`;
      return;
    }

    if(room.round===1 || room.round===4){
      const bank = room.round===1 ? round1Questions : round4Questions;
      const idx = room.active.questionIndex;
      const current = idx!=null ? bank[idx] : null;
      if(!current || room.active.kind==='idle'){
        panel.innerHTML = `<div class="waiting"><div class="big">⏳</div>Waiting for the host to open a question…</div>`;
        return;
      }
      if(room.active.kind==='open' && !mySub){
        panel.innerHTML = `
          <h2>${ROUND_NAMES[room.round]}</h2>
          <div class="qcat">${esc(current.cat)}</div>
          <div class="qtext-lg">${esc(current.q)}</div>
          <div class="field" style="margin-top:16px;">
            <label>Your answer</label>
            <input type="text" id="ansInput" value="${esc(draft.ansInput||'')}">
          </div>
          <button class="btn primary" id="btnSubmitAns">Submit answer</button>
        `;
        const inp = document.getElementById('ansInput');
        inp.oninput = ()=> draft.ansInput = inp.value;
        document.getElementById('btnSubmitAns').onclick = async ()=>{
          if(!inp.value.trim()) return;
          try{
            const data = await api({action:'submit', code:state.code, playerId:state.playerId, value:inp.value.trim()});
            state.room = data.room; draft.ansInput=''; render();
          }catch(e){ toast(e.message); }
        };
      } else {
        panel.innerHTML = `
          <h2>${ROUND_NAMES[room.round]}</h2>
          <div class="qcat">${esc(current.cat)}</div>
          <div class="qtext-lg">${esc(current.q)}</div>
          <div class="waiting" style="padding:30px 10px;">
            ${mySub ? `<div>You answered: <b>${esc(mySub.value)}</b></div><div class="muted" style="margin-top:6px;">Waiting on the host…</div>` : `<div class="muted">Submissions are closed.</div>`}
            ${room.active.kind==='revealed' ? `<div class="qanswer">Answer: ${esc(current.a)}</div>` : ''}
          </div>
        `;
      }
      return;
    }

    if(room.round===2){
      if(room.active.presenterId === state.playerId){
        panel.innerHTML = `<div class="waiting"><div class="big">🎤</div>You're presenting! Say your three statements out loud — two true, one lie. Everyone else is voting now.</div>`;
        return;
      }
      if(room.active.kind!=='open' && room.active.kind!=='revealed' || !room.active.presenterId){
        panel.innerHTML = `<div class="waiting"><div class="big">⏳</div>Waiting for the host to pick a presenter and open voting…</div>`;
        return;
      }
      const presenter = room.players[room.active.presenterId];
      if(room.active.kind==='revealed'){
        panel.innerHTML = `
          <h2>Bluff Call</h2>
          <div class="muted" style="margin-bottom:10px;">${presenter?esc(presenter.nickname):'Presenter'}'s lie was <b>Statement ${esc(room.active.correctLetter)}</b>.</div>
          ${mySub ? `<div>You voted: <b>Statement ${esc(mySub.value)}</b> — ${mySub.value===room.active.correctLetter?'correct! +1':'not quite'}</div>` : ''}
        `;
        return;
      }
      panel.innerHTML = `
        <h2>Bluff Call</h2>
        <div class="muted" style="margin-bottom:6px;">${presenter?esc(presenter.nickname):'Presenter'} is sharing three statements. Which one is the lie?</div>
        <div class="letterbtns">
          ${['A','B','C'].map(l=>`<button class="letterbtn ${mySub && mySub.value===l ? 'picked':''}" data-letter="${l}" ${mySub?'disabled':''}>${l}</button>`).join('')}
        </div>
        ${mySub ? `<div class="muted" style="margin-top:14px;">Vote locked in. Waiting for the reveal…</div>` : ''}
      `;
      if(!mySub){
        document.querySelectorAll('.letterbtn').forEach(btn=>{
          btn.onclick = async ()=>{
            try{
              const data = await api({action:'submit', code:state.code, playerId:state.playerId, value:btn.dataset.letter});
              state.room = data.room; render();
            }catch(e){ toast(e.message); }
          };
        });
      }
      return;
    }

    if(room.round===3){
      const idx = room.active.questionIndex;
      const current = idx!=null ? round3Questions[idx] : null;
      if(!current || room.active.kind==='idle'){
        panel.innerHTML = `<div class="waiting"><div class="big">⏳</div>Waiting for the host to open a question…</div>`;
        return;
      }
      if(room.active.kind==='open' && !mySub){
        panel.innerHTML = `
          <h2>Prediction Wager</h2>
          <div class="qcat">${esc(current.cat)}</div>
          <div class="qtext-lg">${esc(current.q)}</div>
          <div class="row2" style="margin-top:16px;">
            <div class="field">
              <label>Your guess</label>
              <input type="number" id="guessInput" value="${esc(draft.guessInput||'')}">
            </div>
            <div class="field">
              <label>Wager (1–3 points)</label>
              <input type="number" id="wagerInput" min="1" max="3" value="${esc(draft.wagerInput||'2')}">
            </div>
          </div>
          <button class="btn primary" id="btnSubmitWager">Lock in guess</button>
        `;
        const gi = document.getElementById('guessInput'); gi.oninput = ()=> draft.guessInput = gi.value;
        const wi = document.getElementById('wagerInput'); wi.oninput = ()=> draft.wagerInput = wi.value;
        document.getElementById('btnSubmitWager').onclick = async ()=>{
          const guess = parseFloat(gi.value);
          let wager = parseInt(wi.value,10);
          if(isNaN(guess)) { toast('Enter a numeric guess'); return; }
          wager = Math.min(3, Math.max(1, isNaN(wager)?1:wager));
          try{
            const data = await api({action:'submit', code:state.code, playerId:state.playerId, value:{guess, wager}});
            state.room = data.room; draft.guessInput=''; render();
          }catch(e){ toast(e.message); }
        };
      } else {
        panel.innerHTML = `
          <h2>Prediction Wager</h2>
          <div class="qcat">${esc(current.cat)}</div>
          <div class="qtext-lg">${esc(current.q)}</div>
          <div class="waiting" style="padding:30px 10px;">
            ${mySub ? `<div>You guessed <b>${esc(mySub.value.guess)}</b>, wagered <b>${esc(mySub.value.wager)}</b></div>` : `<div class="muted">Submissions are closed.</div>`}
            ${room.active.kind==='revealed' ? `<div class="qanswer">Actual value: ${esc(room.active.actualValue)}</div>` : `<div class="muted" style="margin-top:6px;">Waiting on the host…</div>`}
          </div>
        `;
      }
      return;
    }
  }

  boot();
})();
</script>
</body>
</html>
